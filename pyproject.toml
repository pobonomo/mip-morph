[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mip-morph"
version = "0.1.0"
description = "Hide a MIP behind randomized equivalence-preserving reformulations"
requires-python = ">=3.9"
dependencies = ["gurobipy>=10", "scipy"]

[project.scripts]
mipmorph= "mip_morph.cli:main"

[tool.setuptools]
packages = ["mip_morph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
